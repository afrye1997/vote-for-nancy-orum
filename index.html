<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nancy Orum for Bella Vista City Council, Ward 2</title>
    <!--
      The scroll-reveal gate, copied from REVEAL_GATE in scripts/prerender.mjs.
      The built pages never use this file's head, so keep the two in step by
      hand.

      It is not equivalent here, only present. This shell has no prerendered
      markup to hydrate, so under `npm run dev` there is nothing on the page for
      the gate to un-hide and nothing for a bail-out to rescue — the bundle
      renders everything or the page is blank either way. Test the gate itself
      against `npm run build && npm run preview`.
    -->
    <script>
      document.documentElement.classList.add('js')
      addEventListener('load', function () {
        if (!document.documentElement.hasAttribute('data-reveals-ready'))
          document.documentElement.classList.remove('js')
      })
    </script>
  </head>
  <body>
    <!--
      Build shell only. scripts/prerender.mjs overwrites dist/index.html with
      statically rendered HTML. If you are reading this inside dist/, the
      prerender step did not run and the deploy is broken.
    -->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
