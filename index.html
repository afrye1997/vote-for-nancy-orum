<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nancy Orum for Bella Vista City Council, Ward 2</title>
    <!--
      The scroll-reveal gate, mirroring REVEAL_GATE in scripts/prerender.mjs so
      `npm run dev` behaves like the built site. Keep the two in step; the
      built pages never use this file's head.
    -->
    <script>
      document.documentElement.classList.add('js')
      addEventListener('load', function () {
        if (!document.documentElement.hasAttribute('data-reveals-ready'))
          document.documentElement.classList.remove('js')
      })
    </script>
  </head>
  <body>
    <!--
      Build shell only. scripts/prerender.mjs overwrites dist/index.html with
      statically rendered HTML. If you are reading this inside dist/, the
      prerender step did not run and the deploy is broken.
    -->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
